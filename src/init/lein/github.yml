# Generated by `greenshift init lein --ci github`: commit it as is.
# To pin another greenshift release, run init again with the new
# --release and --sha256, and --force.
@AGAIN@
# Upgrade every writer and trusted publisher sharing this history together:
# schema-5 stores need schema-5-capable binaries in both jobs. Tag/checksum
# validation does not establish schema support. Never strip report memberships
# or replace the publisher with a binary built by the test job.
#
# greenshift runs the Leiningen tests (`lein test`'s default selection),
# those most likely to fail first, ordered by the durable test history at
# refs/greenshift/history (greenshift's docs/design/durable-history.md),
# and records every deftest's result. This workflow is separate from the
# repository's own test workflow and changes nothing in it: make it a
# required check only if you mean to. It runs on pushes and by hand, not
# on pull requests, as a whole-suite run in one job can take a long time;
# add `pull_request` below to run it there too (pull requests never
# publish). Two jobs, kept apart:
#
# - test: a read-only token. It restores the history (from the actions
#   cache when there is an authenticated copy, else from the ref), runs
#   the tests, and uploads the history, new run included, as a data
#   artifact.
# - publish: pushes to the default branch only, never pull requests. A
#   job of its own with the only write token: it checks nothing out and
#   runs no test code, only the pinned, checksummed greenshift, which
#   validates the artifact, merges it into the ref and publishes it. The
#   runner is fresh on GitHub's hosted runners and ephemeral self-hosted
#   ones; on a self-hosted runner that is kept between jobs, what the
#   tests leave on it is there when the publisher runs.
#
# A missing history, cache or artifact warns and never fails the job;
# only the tests decide that.
#
# The history, every run's test results by commit and branch, is kept
# whole, never pruned, and published where anyone who can read this
# repository can read it: anyone at all, if the repository is public.
# To stop publishing it, remove this workflow, then delete
# refs/greenshift/history and the greenshift-history-* caches: while
# the workflow is here, the next push to the default branch publishes
# the history again. Earlier copies stay with the forge until its
# garbage collection and cache eviction remove them.
name: greenshift

on: [push, workflow_dispatch]

permissions:
  contents: read

env:
  GREENSHIFT_RELEASE: '@RELEASE@'
  GREENSHIFT_SHA256: '@SHA256@'
  HISTORY_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git

jobs:
  test:
    runs-on: '@RUNS_ON@'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned greenshift release
        shell: bash
        run: |
@INSTALL@
      - name: Resolve canonical cache key
        id: history
        shell: bash
        env:
          GREENSHIFT_HISTORY_TOKEN: ${{ github.token }}
        run: echo "key=$("$RUNNER_TEMP/greenshift" history cache-key --remote "$HISTORY_REMOTE")" >> "$GITHUB_OUTPUT"
      - name: Restore fast copy
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .greenshift/cache
          key: ${{ steps.history.outputs.key }}
      - name: Set up JDK @JAVA@
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '@JAVA@'
      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          lein: @LEIN@
      - name: Cache Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: greenshift-m2-${{ runner.os }}-jdk@JAVA@-${{ hashFiles('@PROJECT_CLJ@') }}
          restore-keys: |
            greenshift-m2-${{ runner.os }}-jdk@JAVA@-
      - name: Run tests and export data
@WORKING_DIRECTORY@
        shell: bash
        env:
          GREENSHIFT_HISTORY_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/greenshift" run lein --history-remote "$HISTORY_REMOTE" \
@HISTORY_FILES@
            --commit "$GITHUB_SHA"
      - name: Upload SQLite data only
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: greenshift-history
          path: .greenshift/publish.sqlite
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1
      - name: Report cache degradation
        if: ${{ !cancelled() && steps.cache.outcome == 'failure' }}
        run: echo '::warning::⚠ History cache unavailable; canonical git history remains the source'

  publish:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: '@RUNS_ON@'
    permissions:
      contents: write
    concurrency:
      group: greenshift-history-publish
      cancel-in-progress: false
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # No repository checkout or code supplied by the test job.
      - name: Install pinned greenshift release
        shell: bash
        run: |
@INSTALL@
      - name: Download SQLite data
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: greenshift-history
          path: data
      - name: Validate, merge and publish
        id: save
        if: ${{ steps.artifact.outcome == 'success' }}
        shell: bash
        env:
          GREENSHIFT_HISTORY_TOKEN: ${{ github.token }}
        run: |
          oid=$("$RUNNER_TEMP/greenshift" history publish --remote "$HISTORY_REMOTE" \
            --db data/publish.sqlite --cache-dir .greenshift/cache --default-branch "$DEFAULT_BRANCH")
          if [[ "$oid" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "key=greenshift-history-$oid" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::⚠ History was not published; no cache copy will be saved'
          fi
      - name: Save fast copy
        id: cache
        if: ${{ steps.save.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .greenshift/cache
          key: ${{ steps.save.outputs.key }}
      - name: Report cache degradation
        if: ${{ !cancelled() && steps.cache.outcome == 'failure' }}
        run: echo '::warning::⚠ History cache save failed; durable ref was published independently'
      - name: Report missing history artifact
        if: ${{ !cancelled() && steps.artifact.outcome == 'failure' }}
        run: echo '::warning::⚠ No history artifact available; keeping the canonical ref unchanged'
