[package]
name = "greenshift"
version = "0.6.2"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "Test selection from test history: ingest JUnit XML into a per-repo SQLite store and select tests from it"
readme = "README.md"
keywords = ["testing", "junit", "test-selection", "ci"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.58", features = ["derive"] }
quick-xml = "0.38"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
flate2 = "1"
secrecy = "0.10"
sha2 = "0.10"
libc = "0.2"
ctrlc = "3"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.3"

[profile.release]
lto = true
codegen-units = 1
