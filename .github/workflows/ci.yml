name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in step with rust-version in Cargo.toml.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked

  release-musl:
    name: static release build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and musl tools
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: cargo build --release
        run: cargo build --locked --release --target "$TARGET"
      - name: Check the binary is statically linked
        run: |
          bin="target/$TARGET/release/greenshift"
          file "$bin"
          out="$(ldd "$bin" 2>&1 || true)"
          echo "ldd: $out"
          case "$out" in
            *"not a dynamic executable"*|*"statically linked"*) ;;
            *) echo "::error::$bin is dynamically linked"; exit 1 ;;
          esac
          "$bin" --version
      - uses: actions/upload-artifact@v4
        with:
          name: greenshift-${{ env.TARGET }}
          path: target/${{ env.TARGET }}/release/greenshift
          if-no-files-found: error
