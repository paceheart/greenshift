name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in step with rust-version in Cargo.toml and release.yml.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    # greenshift dogfoods itself: it orders this job's tests from the test
    # history of earlier runs, kept in the actions cache. Pushes to main
    # save the history; run them one at a time, so each starts from the
    # history the one before saved. A group holds one pending run: a push
    # that lands while another waits cancels the waiting one, which then
    # records nothing. Every other run gets a group of its own.
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'greenshift-db-main' || format('check-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      GREENSHIFT_DB: .greenshift/history.sqlite
      # The pull request's branch, or the pushed one.
      BRANCH: ${{ github.head_ref || github.ref_name }}
      # The lein tests fail, rather than skip, without lein.
      GREENSHIFT_REQUIRE_LEIN: "1"
    steps:
      - uses: actions/checkout@v4
      # GitHub's ref scoping is what keeps pull requests from writing
      # main's test history; this lints the workflow against edits that
      # would have them save it. yq is on GitHub's Ubuntu runners.
      - name: Check only pushes to main save the test history
        run: scripts/check-cache-guard.sh
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      # tests/run_lein.rs runs `greenshift run lein` on a scratch project
      # with real lein; GREENSHIFT_REQUIRE_LEIN (in the job's env, above)
      # fails those tests, rather than skipping them, should lein be missing.
      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          lein: 2.12.0
      # A branch name can hold a comma or run past the key's 512
      # characters, either of which actions/cache refuses; the key gets a
      # cleaned-up form of it.
      - name: Name the branch for the cache key
        id: branch
        run: |
          name="$(scripts/cache-branch.sh "$BRANCH")"
          echo "cache key branch: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # Cache entries cannot be overwritten, so each run saves under a key
      # of its own, and restores the newest entry for its branch, or else
      # main's. Restore keys match by prefix, so the branch ends at a ":",
      # which the cleaned-up name never holds: feat's prefix, unlike
      # "greenshift-db-feat-", cannot match feat-x's keys.
      - name: Restore test history
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GREENSHIFT_DB }}
          key: greenshift-db-${{ steps.branch.outputs.name }}:${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            greenshift-db-${{ steps.branch.outputs.name }}:
            greenshift-db-main:
      - name: Build greenshift and list the tests
        run: |
          cargo build --locked
          mkdir -p target/greenshift
          cargo nextest list --locked --list-type binaries-only \
            --message-format json > target/greenshift/inventory.json
      # Keep --min-runs in step with run_passes in tests/nextest_filter.rs.
      - name: Split the tests into poor and rich
        run: |
          for class in poor rich; do
            target/debug/greenshift nextest-filter --db "$GREENSHIFT_DB" \
              --source nextest --min-runs 3 \
              --inventory target/greenshift/inventory.json --$class \
              > "target/greenshift/$class.expr"
            echo "$class: $(cat "target/greenshift/$class.expr")"
          done
      - name: Check every test is in exactly one pass
        id: partition
        run: scripts/check-partition.sh target/greenshift/poor.expr target/greenshift/rich.expr
      # The rich tests, which have caught every failure on record, run
      # first, to fail fast; the poor ones after. Both passes run, the
      # second even when the first fails; the job fails if either does.
      # Either can select no test (the poor pass while the history is
      # young, the rich one once every test is poor), hence
      # --no-tests=pass.
      - name: cargo nextest run (rich)
        run: |
          cargo nextest run --locked --profile ci-rich --no-tests=pass \
            -E "$(cat target/greenshift/rich.expr)"
      - name: cargo nextest run (poor)
        if: ${{ !cancelled() && steps.partition.outcome == 'success' }}
        run: |
          cargo nextest run --locked --profile ci-poor --no-tests=pass \
            -E "$(cat target/greenshift/poor.expr)"
      # Both passes' JUnit, as one run, failures included. When only one
      # pass wrote JUnit, the run is recorded as partial, so it is never
      # taken for a full run; when neither did, nothing is recorded.
      - name: Record the passes in the test history
        if: always()
        run: |
          scripts/record-history.sh target/debug/greenshift "$GREENSHIFT_DB" \
            "$GITHUB_SHA" nextest \
            target/nextest/ci-rich/junit.xml target/nextest/ci-poor/junit.xml
      # Pull requests read the history but never write it.
      - name: Save test history
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.GREENSHIFT_DB }}
          # The key the restore step was given, so the two cannot drift.
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: cargo test --doc
        run: cargo test --locked --doc

  # release.yml repeats this build for tagged releases; keep the two in
  # step.
  release-musl:
    name: static release build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and musl tools
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: cargo build --release
        run: cargo build --locked --release --target "$TARGET"
      - name: Check the binary is statically linked
        run: |
          bin="target/$TARGET/release/greenshift"
          file "$bin"
          out="$(ldd "$bin" 2>&1 || true)"
          echo "ldd: $out"
          case "$out" in
            *"not a dynamic executable"*|*"statically linked"*) ;;
            *) echo "::error::$bin is dynamically linked"; exit 1 ;;
          esac
          "$bin" --version
      - uses: actions/upload-artifact@v4
        with:
          name: greenshift-${{ env.TARGET }}
          path: target/${{ env.TARGET }}/release/greenshift
          if-no-files-found: error
