# Generated by `greenshift init lein --ci forgejo`: commit it as is.
# To pin another greenshift release, run init again with the new
# --release and --sha256, and --force.
# Give it the same --setup and --project-dir too, or the new workflow goes
# without them.
# Upgrade every writer and trusted publisher sharing this history together:
# schema-5 stores need schema-5-capable binaries in both jobs. Tag/checksum
# validation does not establish schema support. Never strip report memberships
# or replace the publisher with a binary built by the test job.
#
# greenshift runs the Leiningen tests (`lein test`'s default selection),
# those most likely to fail first, ordered by the durable test history at
# refs/greenshift/history (greenshift's docs/design/durable-history.md),
# and records every deftest's result. This workflow is separate from the
# repository's own test workflow and changes nothing in it: make it a
# required check only if you mean to. It runs on pushes and by hand, not
# on pull requests, as a whole-suite run in one job can take a long time;
# add `pull_request` below to run it there too (pull requests never
# publish).
#
# THIS WORKFLOW IS NOT ISOLATED. greenshift's durable-history design
# (docs/design/durable-history.md, "Forgejo capability gate") says:
#
#   Stock Forgejo runner v13.2.2 exports its automatic repository token to
#   every step as both GITHUB_TOKEN and FORGEJO_TOKEN. Stock Forgejo
#   v16.0.3/v17.0.2 grants that token write access outside fork pull
#   requests and ignores workflow permissions. persist-credentials:false or
#   only referencing the token in a publisher step does not make its test
#   job read-only. A separate publisher credential does not revoke the
#   automatic one. This is a platform baseline, not an additional
#   privilege granted by greenshift, but it does not satisfy this design's
#   read-only-test-job guarantee.
#
#   Consequently no ordinary push-test Forgejo workflow is offered as
#   isolated.
#
# So the tests, and everything they build and run, can write this
# repository, refs/greenshift/history included, with the job's token.
# The jobs below are kept apart as on GitHub, so that only the pinned,
# checksummed greenshift publishes, and only for pushes to the default
# branch; but that limits what greenshift does, not what test code can
# do. No `permissions` are written: Forgejo ignores them, and they would
# claim otherwise.
#
# The history, every run's test results by commit and branch, is kept
# whole, never pruned, and published where anyone who can read this
# repository can read it: anyone at all, if the repository is public.
# To stop publishing it, remove this workflow, then delete
# refs/greenshift/history and the greenshift-history-* caches: while
# the workflow is here, the next push to the default branch publishes
# the history again. Earlier copies stay with the forge until its
# garbage collection and cache eviction remove them.
#
# Forgejo's artifact and cache actions differ from GitHub's: the artifact
# steps use Forgejo's own forks, as stock v4 refuses to run here. Check a
# first run on your instance; missing history, cache or artifacts warn and
# never fail the job. Actions are named by full URL, not resolved against
# the instance's DEFAULT_ACTIONS_URL, so that each pinned commit is looked
# up in the repository it was pinned from, whatever that setting names.
# The JDK and Leiningen steps are fetched from github.com, where they were
# pinned, so the runner needs to reach it.
name: greenshift

on: [push, workflow_dispatch]

env:
  GREENSHIFT_RELEASE: 'v0.3.0'
  GREENSHIFT_SHA256: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
  HISTORY_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git

jobs:
  test:
    runs-on: 'docker'
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned greenshift release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GREENSHIFT_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::GREENSHIFT_RELEASE is not a release tag (vX.Y.Z)"; exit 1; }
          [[ "$GREENSHIFT_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
            { echo "::error::GREENSHIFT_SHA256 is not a SHA-256 checksum"; exit 1; }
          bin="$RUNNER_TEMP/greenshift"
          # Whatever fails, no download is left behind (curl --remove-on-error
          # would need curl 7.83, newer than many runner images have).
          trap 'rm -f "$bin.download"' EXIT
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/paceheart/greenshift/releases/download/$GREENSHIFT_RELEASE/greenshift-$GREENSHIFT_RELEASE-x86_64-unknown-linux-musl" \
            --output "$bin.download"
          # Fail closed: only a binary matching the pinned checksum is installed.
          if ! printf '%s  %s\n' "$GREENSHIFT_SHA256" "$bin.download" | sha256sum --check --strict; then
            echo "::error::greenshift $GREENSHIFT_RELEASE does not match the pinned SHA-256; not installed"
            exit 1
          fi
          chmod +x "$bin.download"
          mv "$bin.download" "$bin"
      - name: Resolve canonical cache key
        id: history
        shell: bash
        env:
          GREENSHIFT_HISTORY_TOKEN: ${{ github.token }}
        run: echo "key=$("$RUNNER_TEMP/greenshift" history cache-key --remote "$HISTORY_REMOTE")" >> "$GITHUB_OUTPUT"
      - name: Restore fast copy
        id: cache
        continue-on-error: true
        uses: https://data.forgejo.org/actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .greenshift/cache
          key: ${{ steps.history.outputs.key }}
      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Leiningen
        uses: https://github.com/DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          lein: 2.12.0
      # From --setup: run in the repository root, before the tests.
      - name: Set up the project
        shell: bash
        run: |
          pin="$(sed -n 's/^PINNED_BASE_SHA="\([0-9a-f]\{40\}\)"$/\1/p' overlay.sh)"
          [ "${#pin}" -eq 40 ] || { echo "no PINNED_BASE_SHA in overlay.sh" >&2; exit 1; }
          git init -q vaelii
          git -C vaelii fetch -q --depth 1 https://github.com/vaelii/vaelii.git "$pin"
          git -C vaelii checkout -q --detach FETCH_HEAD
          VAELII_UPSTREAM="$PWD/vaelii" ./overlay.sh
      - name: Cache Maven dependencies
        uses: https://data.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: greenshift-m2-${{ runner.os }}-jdk25-${{ hashFiles('vaelii/project.clj') }}
          restore-keys: |
            greenshift-m2-${{ runner.os }}-jdk25-
      - name: Run tests and export data
        working-directory: 'vaelii'
        shell: bash
        env:
          GREENSHIFT_HISTORY_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/greenshift" run lein --history-remote "$HISTORY_REMOTE" \
            --history-cache-dir "$GITHUB_WORKSPACE/.greenshift/cache" \
            --history-artifact "$GITHUB_WORKSPACE/.greenshift/publish.sqlite" \
            --commit "$GITHUB_SHA"
      - name: Upload SQLite data only
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4: v4.3.1, GHES check disabled
        with:
          name: greenshift-history
          path: .greenshift/publish.sqlite
          if-no-files-found: warn
          retention-days: 1
      - name: Report cache degradation
        if: ${{ !cancelled() && steps.cache.outcome == 'failure' }}
        run: echo '::warning::⚠ History cache unavailable; canonical git history remains the source'

  publish:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: 'docker'
    concurrency:
      group: greenshift-history-publish
      cancel-in-progress: false
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # A job of its own: no repository checkout or code supplied by the
      # test job. Not a token boundary on Forgejo (see the top).
      - name: Install pinned greenshift release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GREENSHIFT_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::GREENSHIFT_RELEASE is not a release tag (vX.Y.Z)"; exit 1; }
          [[ "$GREENSHIFT_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
            { echo "::error::GREENSHIFT_SHA256 is not a SHA-256 checksum"; exit 1; }
          bin="$RUNNER_TEMP/greenshift"
          # Whatever fails, no download is left behind (curl --remove-on-error
          # would need curl 7.83, newer than many runner images have).
          trap 'rm -f "$bin.download"' EXIT
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/paceheart/greenshift/releases/download/$GREENSHIFT_RELEASE/greenshift-$GREENSHIFT_RELEASE-x86_64-unknown-linux-musl" \
            --output "$bin.download"
          # Fail closed: only a binary matching the pinned checksum is installed.
          if ! printf '%s  %s\n' "$GREENSHIFT_SHA256" "$bin.download" | sha256sum --check --strict; then
            echo "::error::greenshift $GREENSHIFT_RELEASE does not match the pinned SHA-256; not installed"
            exit 1
          fi
          chmod +x "$bin.download"
          mv "$bin.download" "$bin"
      - name: Download SQLite data
        id: artifact
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4: v4.1.4, GHES check disabled
        with:
          name: greenshift-history
          path: data
      - name: Validate, merge and publish
        id: save
        if: ${{ steps.artifact.outcome == 'success' }}
        shell: bash
        env:
          GREENSHIFT_HISTORY_TOKEN: ${{ github.token }}
        run: |
          oid=$("$RUNNER_TEMP/greenshift" history publish --remote "$HISTORY_REMOTE" \
            --db data/publish.sqlite --cache-dir .greenshift/cache --default-branch "$DEFAULT_BRANCH")
          if [[ "$oid" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "key=greenshift-history-$oid" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::⚠ History was not published; no cache copy will be saved'
          fi
      - name: Save fast copy
        id: cache
        if: ${{ steps.save.outputs.key != '' }}
        continue-on-error: true
        uses: https://data.forgejo.org/actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .greenshift/cache
          key: ${{ steps.save.outputs.key }}
      - name: Report cache degradation
        if: ${{ !cancelled() && steps.cache.outcome == 'failure' }}
        run: echo '::warning::⚠ History cache save failed; durable ref was published independently'
      - name: Report missing history artifact
        if: ${{ !cancelled() && steps.artifact.outcome == 'failure' }}
        run: echo '::warning::⚠ No history artifact available; keeping the canonical ref unchanged'
